<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Conversor de Unidades</title>
    <link
      href="https://fonts.googleapis.com/css?family=Inknut+Antiqua"
      rel="stylesheet"
    />
    <link href="miEstilo.css" type="text/css" rel="stylesheet" />
    <script src="misFunciones.js"></script>
  </head>
  <body class="body-num">
    <div class="centrado div-conver">
      <h1>Conversor de Unidades</h1>
      <form>
        <p>
          <label for="grados">Grados</label> =
          <input
            id="grados"
            type="text"
            name="unid_grados"
            onchange="convertirGradosRadianes(this.value, this.id)"
          />
        </p>

        <p>
          <label for="radianes">Radianes</label> =
          <input
            id="radianes"
            type="text"
            name="unid_radianes"
            onchange="convertirGradosRadianes(this.value, this.id)"
          />
        </p>
      </form>
    </div>
  </body>
</html>
