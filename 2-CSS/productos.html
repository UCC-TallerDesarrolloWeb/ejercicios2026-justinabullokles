<!doctype html>
<html>
  <head>
    <title>Catalogo de productos</title>
    <meta charset="UTF-8">
    <link href="catalogo.css" type="text/css" rel="stylesheet" />
    <script src="../3-Js/misFunciones.js" defer></script>
    <script src="../3-Js/tienda.js" defer></script>
  </head>
  <body onload="renderizarProductos()">
          <div class="grid-container">
    <header class="item1">Catalogo productos</header>
    <nav class="item2">
      <a href="productos.html">Catalogo de productos</a>
      <a href="carrito.html">Carrito de compras</a>

      Links de navegacion
    </nav>
    <aside class="item3">
      <
<form name="filter">
    <fieldset>
        <legend>Busqueda</legend>
        <label for="search">Buscar</label>
        <input type="text" id="search" name="search"
               oninput="filtrarProductos()">
    </fieldset>

    <fieldset>
        <legend>Precios</legend>
        <p>
            <label for="precioMin">Minimo</label>
            <input type="number" id="precioMin" min="0"
                   oninput="filtrarProductos()">
        </p>
        <p>
            <label for="precioMax">Maximo</label>
            <input type="number" id="precioMax" min="0"
                   oninput="filtrarProductos()">
        </p>
    </fieldset>

    <fieldset>
        <legend>Marca</legend>
        <select id="marca" onchange="filtrarProductos()">
            <option value="">Todas las marcas</option>
            <option value="Gran Marc">Gran Marc</option>
            <option value="Daedo">Daedo</option>
        </select>
    </fieldset>

    <fieldset>
        <legend>Tipo de productos</legend>
        <p>
            <input type="checkbox" id="protectores"
                   name="categoria" value="Protectores"
                   onchange="filtrarProductos()">
            <label for="protectores">Protectores</label>

            <input type="checkbox" id="entrenamiento"
                   name="categoria" value="Entrenamiento"
                   onchange="filtrarProductos()">
            <label for="entrenamiento">Entrenamiento</label>

            <input type="checkbox" id="dobok"
                   name="categoria" value="Dobok"
                   onchange="filtrarProductos()">
            <label for="dobok">Dobok</label>
        </p>
    </fieldset>
</form>

      Filtros
    </aside>
    <main class="item4" id="listadoProductos">
</main>
        
<div>
    <img
        src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/cabezal-cerrado.webp"
        alt="Cabezal cerrado"
    />
    <h3>Cabezal cerrado</h3>
    <button type="button" onclick="mostrarDetalleProducto()">
        Ver detalle de Producto
    </button>
</div>

        <div>
          <img
            src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/dobok.webp"
            alt="DObok"
          />
          <h3>Dobok</h3>
        </div>
        <div>
          <img
            src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/escudo-potencia.webp"
            alt="Escudo potencia"
          />
          <h3>Escudo potencia</h3>
        </div>
        <div>
          <img
            src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/foco-con-dedos.webp"
            alt="Foco con dedos"
          />
          <h3>Foco con dedos</h3>
        </div>
        <div>
          <img
            src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-manos.webp"
            alt="Protectores manos"
          />
          <h3>Protectores manos</h3>
        </div>
        <div>
          <img
            src=" https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/protectores-pie.webp"
            alt="Protectores pie"
          />
          <h3>Protectores pie</h3>
        </div>
      </div>
    </main>


<dialog id="detalleProducto">
